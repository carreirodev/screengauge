<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway, never merged into main.
  Question (WPC-291 "Ícone e identidade visual do ScreenGauge"): what does the icon look like,
  which brand color, and how is the name written?
  Plan: four icon shapes (A–D) plus the owner's AI image (X), each in three palettes, shown at
  real size in every place Windows 11 puts it, dark and light side by side. Shape, palette,
  tray style, wordmark and Store icon switch independently from the yellow bar
  (?shape=&color=&tray=&name=&store=).
  Real size: at 100% browser zoom, one CSS px is one logical pixel, so a 16 px icon here has
  as many physical pixels as the real tray icon on the monitor the window is on.
  The owner's images are not committed; they load from the main checkout's
  DesignInterface/MS Store images/, five folders up from this file's worktree.
  Open by double-clicking this file. No build, no server, nothing saved.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenGauge icon prototype</title>
<style>
html, body { margin: 0; background: #77736d; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #111; }
main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 120px; }
h1 { font: 600 20px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0 0 4px; color: #fff; }
.lead { color: #f1efea; font-size: 13px; margin: 0 0 14px; }
.lead b { color: #ffd60a; }
section { margin: 0 0 18px; }
section > h2 { font: 600 14px/1.2 "Segoe UI", sans-serif; color: #fff; margin: 0 0 6px; }
section > h2 small { font-weight: 400; color: #e7e3dc; margin-left: 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell { border-radius: 8px; padding: 14px; overflow: hidden; position: relative; }
.cell.dark { background: #202020; color: #fff; }
.cell.light { background: #f3f3f3; color: #000; }
.cell .lbl { position: absolute; top: 6px; right: 10px; font-size: 11px; opacity: .55; }
svg.ic, img.ic { display: block; flex: none; }

/* Taskbar slice (right side) */
.tb { height: 48px; display: flex; align-items: center; gap: 0; padding: 0 6px 0 10px; border-radius: 6px; font-size: 12px; }
.tb.dark { background: #1c1c1c; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.tb.light { background: #eeeff1; color: #000; box-shadow: inset 0 1px 0 rgba(0,0,0,.08); }
.tb .slot { width: 32px; height: 40px; display: grid; place-items: center; border-radius: 4px; }
.tb .slot.ours { outline: 1px dashed rgba(255,214,10,.0); }
.tb .qs { display: flex; gap: 8px; align-items: center; padding: 0 8px; height: 40px; border-radius: 4px; margin-left: 4px; }
.tb .clock { text-align: right; line-height: 16px; padding: 0 8px; margin-left: 2px; }
.tb .spacer { flex: 1; }

/* Compare matrix */
.matrix { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)); gap: 6px; align-items: center; }
.matrix .tb { padding: 0 2px 0 4px; }
.matrix .tb .qs { gap: 6px; padding: 0 4px; }
.matrix .hd { color: #fff; font-size: 12px; font-weight: 600; }
.matrix .rowname { color: #fff; font-size: 12.5px; line-height: 1.25; }
.matrix .rowname b { color: #ffd60a; }
.matrix .cur { outline: 2px solid #ffd60a; outline-offset: 2px; border-radius: 6px; }
.matrix .rowname.cur { outline: none; }
.matrix .rowname.cur b::after { content: "  ◀ escolhida"; font-weight: 400; color: #ffd60a; }
.matrix .none { height: 48px; display: grid; place-items: center; color: #ddd; font-size: 12px; border-radius: 6px; background: rgba(0,0,0,.18); }

/* Hidden icons panel */
.flyout { display: inline-grid; grid-template-columns: repeat(4, 40px); grid-auto-rows: 40px; place-items: center; padding: 6px; border-radius: 8px; }
.dark .flyout { background: #2c2c2c; border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.light .flyout { background: #f9f9f9; border: 1px solid rgba(0,0,0,.1); box-shadow: 0 8px 24px rgba(0,0,0,.18); }

/* Start menu */
.start { border-radius: 8px; padding: 16px 20px; }
.dark .start { background: #2a2a2a; border: 1px solid rgba(255,255,255,.08); }
.light .start { background: #f9f9f9; border: 1px solid rgba(0,0,0,.08); }
.start .t { font-weight: 600; font-size: 14px; margin: 0 0 12px; }
.pins { display: grid; grid-template-columns: repeat(6, 1fr); row-gap: 10px; }
.pin { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; text-align: center; }
.applist { margin-top: 14px; display: grid; gap: 2px; }
.applist .row { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 10px; border-radius: 4px; font-size: 14px; }
.dark .applist .row.ours { background: rgba(255,255,255,.06); }
.light .applist .row.ours { background: rgba(0,0,0,.04); }

/* Taskbar center */
.tbc { height: 48px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 6px; }
.tbc.dark { background: #1c1c1c; }
.tbc.light { background: #eeeff1; }
.tbc .app { width: 44px; height: 40px; display: grid; place-items: center; border-radius: 4px; position: relative; }
.tbc .app.on { background: rgba(255,255,255,.08); }
.tbc.light .app.on { background: rgba(0,0,0,.05); }
.tbc .app.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 16px; height: 3px; border-radius: 2px; background: #4cc2ff; }
.tbc.light .app.on::after { background: #005fb8; }

/* Installed apps */
.inst { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 6px; font-size: 14px; }
.dark .inst { background: #2b2b2b; }
.light .inst { background: #fbfbfb; border: 1px solid rgba(0,0,0,.06); }
.inst .sub { font-size: 12px; opacity: .7; }
.inst .sp { flex: 1; }

/* Store */
.store { border-radius: 8px; overflow: hidden; position: relative; }
.store .hero { height: 260px; background-size: cover; background-position: center; position: relative; }
.store .hero::after { content: ""; position: absolute; inset: 0; }
.dark .store .hero::after { background: linear-gradient(90deg, rgba(32,32,32,.92) 0%, rgba(32,32,32,.55) 45%, rgba(32,32,32,0) 75%), linear-gradient(0deg, #202020 0%, rgba(32,32,32,0) 40%); }
.light .store .hero::after { background: linear-gradient(90deg, rgba(243,243,243,.92) 0%, rgba(243,243,243,.55) 45%, rgba(243,243,243,0) 75%), linear-gradient(0deg, #f3f3f3 0%, rgba(243,243,243,0) 40%); }
.store .info { position: absolute; left: 22px; top: 42px; z-index: 1; display: flex; gap: 18px; align-items: flex-start; }
.store .tile { width: 112px; height: 112px; border-radius: 10px; display: grid; place-items: center; }
.dark .store .tile { background: rgba(255,255,255,.06); }
.light .store .tile { background: rgba(255,255,255,.7); }
.store .nm { font: 600 26px/1.15 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
.store .pub { font-size: 13px; margin: 4px 0 12px; }
.dark .store .pub { color: #60cdff; }
.light .store .pub { color: #005fb8; }
.store .btn { display: inline-block; padding: 6px 30px; border-radius: 4px; font-size: 14px; font-weight: 600; }
.dark .store .btn { background: #4cc2ff; color: #000; }
.light .store .btn { background: #005fb8; color: #fff; }
.store .missing { position: absolute; right: 10px; bottom: 8px; z-index: 1; font-size: 11px; opacity: .7; }

/* GitHub README */
.gh { border-radius: 6px; overflow: hidden; font-family: -apple-system, "Segoe UI", sans-serif; }
.dark .gh { background: #0d1117; border: 1px solid #30363d; color: #e6edf3; }
.light .gh { background: #ffffff; border: 1px solid #d0d7de; color: #1f2328; }
.gh .bar { padding: 8px 14px; font-size: 13px; font-weight: 600; }
.dark .gh .bar { background: #161b22; border-bottom: 1px solid #30363d; }
.light .gh .bar { background: #f6f8fa; border-bottom: 1px solid #d0d7de; }
.gh .body { padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.gh .wm { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 34px; letter-spacing: -.01em; }
.gh .tag { font-size: 14px; opacity: .75; }

/* Sizes and pixels */
.sizes { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; opacity: .95; }
.peeks { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; align-items: flex-end; }
.peeks figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; }
.peeks canvas { image-rendering: pixelated; border: 1px solid rgba(128,128,128,.35); }

/* Notes panel */
.notes { background: #0a0a0a; color: #eaeaea; border: 1px solid #ffd60a; border-radius: 12px; padding: 12px 16px; font-size: 12.5px; line-height: 1.5; margin: 0 0 16px; }
.notes h3 { margin: 2px 0 6px; font-size: 13px; color: #ffd60a; }
.notes ul { margin: 0; padding-left: 18px; }
.notes a { color: #8fd3ff; }

/* Prototype switcher (not part of the design) */
#pbar { position: fixed; left: 8px; right: 8px; bottom: 10px; width: fit-content; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #0a0a0a; color: #f2f2f2; border: 1px solid #ffd60a; border-radius: 12px; font: 12px/1 "Segoe UI", system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.6); white-space: nowrap; max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center; z-index: 10; }
#pbar .tag { background: #ffd60a; color: #000; font-weight: 700; padding: 4px 6px; border-radius: 6px; letter-spacing: .05em; }
#pbar .grp { display: flex; align-items: center; gap: 4px; padding: 0 6px; border-left: 1px solid #333; }
#pbar .k { color: #9b9b9b; }
#pbar .v { color: #ffd60a; font-weight: 700; min-width: 0; }
#pbar button { background: #1d1d1d; color: #f2f2f2; border: 1px solid #3a3a3a; border-radius: 7px; height: 28px; padding: 0 8px; font: inherit; cursor: pointer; }
#pbar button:hover { border-color: #ffd60a; }
#pbar button.on { background: #ffd60a; color: #000; border-color: #ffd60a; }
</style>
</head>
<body>
<main>
  <h1>ScreenGauge — ícone e identidade (protótipo, WPC-291)</h1>
  <p class="lead" id="scaleInfo"></p>
  <div class="notes" id="notes" hidden></div>

  <div id="round2"></div>

  <section>
    <h2>Todas as formas perto do relógio <small>tamanho real; a linha amarela marca a forma escolhida na barra</small></h2>
    <div class="matrix" id="matrix"></div>
  </section>

  <div id="detail"></div>
</main>

<div id="pbar">
  <span class="tag">PROTÓTIPO</span>
  <span class="grp"><span class="k">Forma</span><button id="shPrev" title="Forma anterior (←)">◀</button><span class="v" id="shName"></span><button id="shNext" title="Próxima forma (→)">▶</button></span>
  <span class="grp"><span class="k">Cor</span><button id="coPrev" title="Cor anterior (↓)">◀</button><span class="v" id="coName"></span><button id="coNext" title="Próxima cor (↑)">▶</button></span>
  <span class="grp"><span class="k">Bandeja</span><button id="trColor">Colorido</button><button id="trMono">Uma cor</button></span>
  <span class="grp"><span class="k">Nome</span><button id="nmNext" title="Próximo jeito de escrever o nome (N)"></button></span>
  <span class="grp"><span class="k">Ícone na Store</span><button id="stPrev" title="Ícone anterior da Store (S com Shift)">◀</button><span class="v" id="stName"></span><button id="stNext" title="Próximo ícone da Store (S)">▶</button></span>
  <span class="grp"><button id="notesBtn" title="O que a Microsoft pede para ícones e para a página da Store">Regras</button></span>
</div>

<script>
'use strict';

// The owner's images live in the main checkout, untracked: five levels up from this file.
const OWNER = '../../../../../DesignInterface/MS Store images/';
const IMG_3DA = encodeURI(OWNER + 'icone 3da.png');
const IMG_HERO = encodeURI(OWNER + 'Wide MS Store.png');

// p = the body color (light, mid, dark), s = the accent/ruler color, deep = the accent's darkest shade
// (strong outline, far side of the Store icon's thickness), brand = [on dark, on light].
const PALETTES = [
  { key: '1', name: 'Laranja e grafite', from: 'do pedido do dono, no lugar de roxo e laranja', p: ['#6B7280', '#3A3F48', '#1A1C20'], s: ['#FED7AA', '#F97316', '#9A3412'], deep: '#7C2D12', brand: ['#FB923C', '#C2410C'] },
  { key: '2', name: 'Azul e amarelo', from: 'da arte larga da Store', p: ['#93C5FD', '#2563EB', '#1E3A8A'], s: ['#FEF08A', '#FACC15', '#A16207'], deep: '#854D0E', brand: ['#60A5FA', '#1D4ED8'] },
  { key: '3', name: 'Ciano e grafite', from: 'da barra e da linha de medida aprovadas', p: ['#6B7280', '#3A3F48', '#1A1C20'], s: ['#A5F3FC', '#22D3EE', '#0E7490'], deep: '#164E63', brand: ['#22D3EE', '#0E7490'] },
];

let uid = 0;
const nid = p => `${p}${++uid}`;
// Detail level by physical pixels: s = 16–20 (tray at 100–125%), m = up to 36, l = larger.
const level = phys => phys <= 20 ? 's' : phys <= 36 ? 'm' : 'l';

const grad = (id, a, b, vertical) =>
  `<linearGradient id="${id}" x1="0" y1="0" x2="${vertical ? 0 : 1}" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const shadow = id =>
  `<filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".35"/></filter>`;

// Ticks along the top edge of a horizontal bar, in the bar's own coordinates.
function ticks(x0, x1, y, L, color, asMask) {
  const step = L === 'l' ? 3 : L === 'm' ? 6 : 8;
  const w = L === 'l' ? 1 : L === 'm' ? 1.8 : 3;
  let o = '';
  let i = 0;
  for (let x = x0; x <= x1 + 0.01; x += step, i++) {
    const len = L === 's' ? 6 : (i % 2 ? 3.2 : 5.5);
    o += `<rect x="${(x - w / 2).toFixed(2)}" y="${y - 0.5}" width="${w}" height="${len + 0.5}" fill="${asMask ? '#000' : color}"/>`;
  }
  return o;
}

const SHAPES = {
  A: {
    name: 'Tela e régua',
    why: 'Segue a imagem 3da: uma tela de frente com uma régua por cima.',
    color(P, L) {
      const g1 = nid('g'), g2 = nid('g'), sh = nid('f');
      const h = L === 's' ? 13 : 11;
      let o = `<defs>${grad(g1, P.p[0], P.p[1])}${grad(g2, P.s[0], P.s[1], true)}${shadow(sh)}</defs>`;
      o += `<rect x="3" y="6" width="38" height="30" rx="4" fill="${L === 's' ? P.p[1] : `url(#${g1})`}"/>`;
      o += `<rect x="6" y="9" width="32" height="24" rx="2" fill="${P.p[2]}"/>`;
      if (L === 'l') {
        for (let x = 10; x <= 34; x += 4) o += `<rect x="${x - 0.3}" y="9" width=".6" height="24" fill="${P.p[0]}" opacity=".28"/>`;
        for (let y = 13; y <= 29; y += 4) o += `<rect x="6" y="${y - 0.3}" width="32" height=".6" fill="${P.p[0]}" opacity=".28"/>`;
      }
      o += `<g transform="rotate(-40 29 31)"${L === 's' ? '' : ` filter="url(#${sh})"`}>`;
      o += `<rect x="11" y="${31 - h / 2}" width="36" height="${h}" rx="2" fill="${L === 's' ? P.s[1] : `url(#${g2})`}"/>`;
      o += ticks(L === 's' ? 21 : 14, L === 's' ? 37 : 44, 31 - h / 2, L, P.s[2]);
      return o + '</g>';
    },
    mono(L) {
      const m1 = nid('m'), m2 = nid('m');
      const h = L === 's' ? 13 : 11;
      let o = `<defs>
        <mask id="${m1}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="88" height="88"><rect x="-20" y="-20" width="88" height="88" fill="#fff"/><g transform="rotate(-40 29 31)"><rect x="8.5" y="${31 - h / 2 - 2.5}" width="41" height="${h + 5}" rx="3" fill="#000"/></g></mask>
        <mask id="${m2}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="88" height="88"><rect x="-20" y="-20" width="88" height="88" fill="#fff"/>${ticks(L === 's' ? 21 : 14, L === 's' ? 37 : 44, 31 - h / 2, L, '', true)}</mask>
      </defs>`;
      o += `<g mask="url(#${m1})"><rect x="5" y="8" width="34" height="26" rx="3.5" fill="none" stroke="currentColor" stroke-width="${L === 's' ? 4.5 : 3.5}"/></g>`;
      o += `<g transform="rotate(-40 29 31)"><rect x="11" y="${31 - h / 2}" width="36" height="${h}" rx="2" fill="currentColor" mask="url(#${m2})"/></g>`;
      return o;
    },
  },
  B: {
    name: 'Botão da barra',
    why: 'Um botão da própria barra do ScreenGauge, com a linha de medida e a etiqueta.',
    color(P, L) {
      const g1 = nid('g');
      let o = `<defs>${grad(g1, P.p[1], P.p[2], true)}</defs>`;
      o += `<rect x="2" y="2" width="44" height="44" rx="${L === 's' ? 9 : 11}" fill="url(#${g1})"${L === 's' ? '' : ` stroke="${P.p[0]}" stroke-opacity=".35" stroke-width="1"`}/>`;
      if (L !== 's') o += `<rect x="4" y="3.5" width="40" height="19" rx="9.5" fill="#fff" opacity=".12"/>`;
      return o + glyphB(L, P.s[1]);
    },
    mono(L) {
      const m = nid('m');
      return `<defs><mask id="${m}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="88" height="88"><rect x="-20" y="-20" width="88" height="88" fill="#fff"/>${glyphB(L, '#000')}</mask></defs>
        <rect x="2" y="2" width="44" height="44" rx="${L === 's' ? 9 : 11}" fill="currentColor" mask="url(#${m})"/>`;
    },
  },
  C: {
    name: 'Cantos',
    why: 'Os quatro cantos do Bounds em volta de um conteúdo: medir o que está na tela.',
    color(P, L) {
      const g1 = nid('g');
      const r = L === 's' ? [15, 18] : [16, 16];
      return `<defs>${grad(g1, P.p[0], P.p[1])}</defs>${cornersC(L, P.s[1])}
        <rect x="${r[0]}" y="${r[0]}" width="${r[1]}" height="${r[1]}" rx="3" fill="${L === 's' ? P.p[1] : `url(#${g1})`}"/>`;
    },
    mono(L) {
      const r = L === 's' ? [15, 18] : [16, 16];
      return `${cornersC(L, 'currentColor')}<rect x="${r[0]}" y="${r[0]}" width="${r[1]}" height="${r[1]}" rx="3" fill="currentColor"/>`;
    },
  },
  D: {
    name: 'Esquadro',
    why: 'Um esquadro de desenho, com marcas de medida: uma silhueta só, sem tela.',
    // edge 'strong' is the round-2 tray candidate with a darker, thicker outline for the light taskbar.
    color(P, L, edge) {
      const g1 = nid('g');
      const strong = edge === 'strong';
      const sw = (L === 's' ? 1.5 : 1.2) * (strong ? 1.8 : 1);
      let o = `<defs>${grad(g1, P.s[0], P.s[1])}</defs>`;
      o += `<path d="${triD(L)}" fill-rule="evenodd" fill="${L === 's' ? P.s[1] : `url(#${g1})`}" stroke="${strong ? P.deep : P.s[2]}" stroke-width="${sw}" stroke-linejoin="round"/>`;
      if (L !== 's') o += ticksD(L, P.p[2]);
      return o;
    },
    mono(L) {
      const m = nid('m');
      if (L === 's') return `<path d="${triD(L)}" fill-rule="evenodd" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>`;
      return `<defs><mask id="${m}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="88" height="88"><rect x="-20" y="-20" width="88" height="88" fill="#fff"/>${ticksD(L, '#000')}</mask></defs>
        <path d="${triD(L)}" fill-rule="evenodd" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" mask="url(#${m})"/>`;
    },
  },
  X: { name: 'Imagem 3da (sua)', why: 'A imagem gerada com IA, como está, encolhida pelo Windows.' },
};
const SHAPE_KEYS = ['A', 'B', 'C', 'D', 'X'];

function glyphB(L, c) {
  const t = L === 's' ? 4 : 3;
  const capH = L === 's' ? 16 : 14;
  const y = 30;
  return `<rect x="10" y="${y - t / 2}" width="28" height="${t}" rx="${t / 2}" fill="${c}"/>
    <rect x="${10 - t / 2 + 0.5}" y="${y - capH / 2}" width="${t}" height="${capH}" rx="${t / 2}" fill="${c}"/>
    <rect x="${38 - t / 2 - 0.5}" y="${y - capH / 2}" width="${t}" height="${capH}" rx="${t / 2}" fill="${c}"/>
    <rect x="${L === 's' ? 15 : 16}" y="${L === 's' ? 9 : 11}" width="${L === 's' ? 18 : 16}" height="${L === 's' ? 9 : 8}" rx="3" fill="${c}"/>`;
}
function cornersC(L, c) {
  const w = L === 's' ? 5.5 : 4;
  return `<path d="M6 17V6h11M31 6h11v11M42 31v11H31M17 42H6V31" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function triD(L) {
  return L === 's' ? 'M5 5L5 43L43 43Z M13 23L13 35L25 35Z' : 'M5 5L5 43L43 43Z M12 21L12 36L27 36Z';
}
function ticksD(L, c) {
  const step = L === 'l' ? 4 : 8;
  const w = L === 'l' ? 1.1 : 1.8;
  let o = '';
  let i = 0;
  for (let y = 11; y <= 39; y += step, i++) o += `<rect x="5" y="${y - w / 2}" width="${i % 2 ? 2.8 : 4.5}" height="${w}" fill="${c}"/>`;
  i = 0;
  for (let x = 9; x <= 37; x += step, i++) o += `<rect x="${x - w / 2}" y="${43 - (i % 2 ? 2.8 : 4.5)}" width="${w}" height="${i % 2 ? 2.8 : 4.5}" fill="${c}"/>`;
  return o;
}

// One icon at `css` CSS px; detail follows the physical pixels it will really get.
function icon(shapeKey, P, mode, css, physOverride, edge) {
  const phys = physOverride ?? Math.round(css * devicePixelRatio);
  if (shapeKey === 'X') return `<img class="ic" src="${IMG_3DA}" width="${css}" height="${css}" alt="">`;
  const S = SHAPES[shapeKey];
  const inner = mode === 'mono' ? S.mono(level(phys)) : S.color(P, level(phys), edge);
  return `<svg class="ic" xmlns="http://www.w3.org/2000/svg" width="${css}" height="${css}" viewBox="0 0 48 48">${inner}</svg>`;
}

// Round 2: the set square with volume, for the Store's 300 × 300 icon only.

  { key: '3', name: 'Inclinado', why: 'O mesmo de acrílico, girado e mais grosso, no espírito da imagem 3da.' },
];
function store3d(P, v, css) {
  const tri = triD('l');
  const g1 = nid('g'), g2 = nid('g'), cp = nid('c'), sh = nid('f'), bl = nid('f');
  const depth = v === 1 ? 0 : v === 2 ? 6 : 9;
  let defs = `${grad(g1, P.s[0], P.s[1])}
    <linearGradient id="${g2}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${v === 3 ? .75 : .5}"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="${cp}"><path d="${tri}" clip-rule="evenodd"/></clipPath>
    <filter id="${sh}" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#000" flood-opacity=".28"/><feDropShadow dx="0" dy=".3" stdDeviation=".3" flood-color="#000" flood-opacity=".22"/></filter>
    <filter id="${bl}" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="${v === 3 ? 2.2 : 1.6}"/></filter>`;
  let body = '';
  if (v > 1) body += `<ellipse cx="${v === 3 ? 27 : 25}" cy="${v === 3 ? 50 : 48.5}" rx="${v === 3 ? 22 : 20}" ry="${v === 3 ? 3 : 2.2}" fill="#000" opacity=".32" filter="url(#${bl})"/>`;
  for (let i = depth; i >= 1; i--) {
    body += `<path d="${tri}" fill-rule="evenodd" fill="${i === depth ? P.deep : P.s[2]}" stroke="${i === depth ? P.deep : P.s[2]}" stroke-width="1.2" stroke-linejoin="round" transform="translate(${(i * 0.35).toFixed(2)} ${(i * 0.6).toFixed(2)})"/>`;
  }
  body += `<path d="${tri}" fill-rule="evenodd" fill="url(#${g1})"${v === 1 ? ` filter="url(#${sh})"` : ''} stroke="${P.s[2]}" stroke-width="${v === 1 ? .8 : .6}" stroke-linejoin="round"${v > 1 ? ' fill-opacity=".96"' : ''}/>`;
  body += ticksD('l', P.p[2]);
  body += `<g clip-path="url(#${cp})"><rect x="0" y="0" width="48" height="48" fill="url(#${g2})"/>` +
    (v > 1 ? `<path d="M5 5L5 43" stroke="#fff" stroke-opacity="${v === 3 ? .8 : .55}" stroke-width="1.4"/>` : `<path d="M5 5L5 43" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>`) + `</g>`;
  if (v === 3) body = `<g transform="rotate(-12 24 26)">${body}</g>`;
  return `<svg class="ic" xmlns="http://www.w3.org/2000/svg" width="${css}" height="${css}" viewBox="-4 -4 56 56"><defs>${defs}</defs>${body}</svg>`;
}

// For the real-tray check: the set square rasterized at each .ico size, as base64 RGBA rows.
window.__icoFrames = async (edge, sizes) => {
  const P = PAL();
  const out = {};
  for (const n of sizes) {
    const svg = icon('D', P, 'color', n, n, edge);
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    const c = document.createElement('canvas');
    c.width = c.height = n;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, n, n);
    const px = x.getImageData(0, 0, n, n).data;
    let bin = '';
    for (let i = 0; i < px.length; i++) bin += String.fromCharCode(px[i]);
    out[n] = btoa(bin);
  }
  return out;
};

// Rasterizes the icon at exactly n×n pixels, as an .ico entry would hold it, then enlarges it.
function drawPeeks() {
  const P = PAL();
  for (const cv of document.querySelectorAll('canvas[data-n]')) {
    const n = +cv.dataset.n;
    const th = cv.dataset.th;
    const mode = S.tray === 'mono' && n <= 32 && S.shape !== 'X' ? 'mono' : 'color';
    const img = new Image();
    if (S.shape === 'X') img.src = IMG_3DA;
    else {
      const svg = icon(S.shape, P, mode, n, n).replace('<svg ', `<svg style="color:${ink(th)}" `);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    img.onload = () => {
      const small = document.createElement('canvas');
      small.width = small.height = n;
      const sc = small.getContext('2d');
      sc.imageSmoothingQuality = 'high';
      sc.drawImage(img, 0, 0, n, n);
      const c = cv.getContext('2d');
      c.imageSmoothingEnabled = false;
      c.fillStyle = th === 'dark' ? '#1c1c1c' : '#eeeff1';
      c.fillRect(0, 0, cv.width, cv.height);
      c.drawImage(small, 0, 0, cv.width, cv.height);
    };
  }
}

    <li>Estilo do Windows 11: de frente ("straight-on perspective"), uma ou duas metáforas, poucas formas, gradientes suaves, nada de letras no ícone; pelo menos metade do ícone com contraste 3:1 nos temas claro e escuro; amarelo nunca passa no tema claro. <a href="https://learn.microsoft.com/en-us/windows/apps/design/iconography/app-icon-design">desenho</a></li>
    <li>Store: um ícone de 300 × 300 enviado no Partner Center tem prioridade sobre o do pacote, então a Store pode mostrar um ícone diferente do que aparece no Windows. <a href="https://learn.microsoft.com/en-us/windows/apps/publish/publish-your-app/msix/screenshots-and-images">imagens da Store</a></li>
    <li>Arte larga da Store (16:9): PNG de 1920 × 1080 ou 3840 × 2160, sem texto, o principal no centro e fora do terço de baixo, pouco espaço vazio, "do not use any device-specific imagery". A sua tem 1672 × 941. <a href="https://learn.microsoft.com/en-us/windows/apps/publish/publish-your-app/msix/screenshots-and-images">imagens da Store</a></li>
    <li>Os pixels ampliados vêm do navegador, sem acerto à mão; o ícone final ganha um desenho próprio para 16, 20 e 24 px.</li></ul>`;
}

function renderBar() {
  const P = PAL();
  document.getElementById('shName').textContent = `${S.shape} · ${SHAPES[S.shape].name}`;
  document.getElementById('coName').textContent = `${P.key} · ${P.name}`;
  document.getElementById('coName').title = `Cores tiradas ${P.from}`;
  document.getElementById('trColor').classList.toggle('on', S.tray === 'color');
  document.getElementById('trMono').classList.toggle('on', S.tray === 'mono');
  document.getElementById('nmNext').textContent = `${S.name} · ${NAMES[S.name - 1].name}`;
  document.getElementById('stName').textContent = STORE_NAMES[S.store];
  document.getElementById('notesBtn').classList.toggle('on', !document.getElementById('notes').hidden);
  history.replaceState(null, '', `?shape=${S.shape}&color=${S.color}&tray=${S.tray}&name=${S.name}&store=${S.store}`);
}

function renderScale() {
  const pct = Math.round(devicePixelRatio * 100);
  document.getElementById('scaleInfo').innerHTML =
    `Este monitor está a <b>${pct}%</b>: aqui um ícone de 16 px tem <b>${Math.round(16 * devicePixelRatio)} pixels reais</b>, como o ícone de verdade perto do relógio. ` +
    `Deixe o zoom do navegador em 100% (Ctrl + 0) e arraste a janela para o outro monitor para ver a outra escala.`;
}

function render() { uid = 0; renderScale(); renderRound2(); renderMatrix(); renderDetail(); renderBar(); }

const step = (v, d, n) => ((v - 1 + d + n) % n) + 1;
function shapeStep(d) { S.shape = SHAPE_KEYS[(SHAPE_KEYS.indexOf(S.shape) + d + SHAPE_KEYS.length) % SHAPE_KEYS.length]; render(); }
function colorStep(d) { S.color = step(S.color, d, PALETTES.length); render(); }
document.getElementById('shPrev').onclick = () => shapeStep(-1);
document.getElementById('shNext').onclick = () => shapeStep(1);
document.getElementById('coPrev').onclick = () => colorStep(-1);
document.getElementById('coNext').onclick = () => colorStep(1);
document.getElementById('trColor').onclick = () => { S.tray = 'color'; render(); };
document.getElementById('trMono').onclick = () => { S.tray = 'mono'; render(); };
document.getElementById('nmNext').onclick = () => { S.name = step(S.name, 1, NAMES.length); render(); };
function storeStep(d) { S.store = STORE_KEYS[(STORE_KEYS.indexOf(S.store) + d + STORE_KEYS.length) % STORE_KEYS.length]; render(); }
document.getElementById('stPrev').onclick = () => storeStep(-1);
document.getElementById('stNext').onclick = () => storeStep(1);
document.getElementById('notesBtn').onclick = () => { const n = document.getElementById('notes'); n.hidden = !n.hidden; renderBar(); };
window.addEventListener('keydown', e => {
  const t = e.target;
  if (t.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName)) return;
  if (e.key === 'ArrowLeft') shapeStep(-1);
  else if (e.key === 'ArrowRight') shapeStep(1);
  else if (e.key === 'ArrowUp') { e.preventDefault(); colorStep(1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); colorStep(-1); }
  else if (e.key === 'b' || e.key === 'B') { S.tray = S.tray === 'mono' ? 'color' : 'mono'; render(); }
  else if (e.key === 'n' || e.key === 'N') { S.name = step(S.name, 1, NAMES.length); render(); }
  else if (e.key === 's') storeStep(1);
  else if (e.key === 'S') storeStep(-1);
});

// Re-render when the window moves to a monitor with another scale.
(function watchScale() {
  matchMedia(`(resolution: ${devicePixelRatio}dppx)`).addEventListener('change', () => { render(); watchScale(); }, { once: true });
})();

renderNotes();
render();
</script>
