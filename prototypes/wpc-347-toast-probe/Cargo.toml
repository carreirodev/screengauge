[package]
name = "toast-probe"
version = "0.1.0"
edition = "2024"
publish = false
description = "PROTOTYPE, throwaway (WPC-347): tests Windows' standard notifications from an unpackaged exe. Never merged into main."

# Its own workspace, so the root build, the pre-commit hook and CI never see it.
[workspace]

[dependencies]
# Direct dependency because `#[implement]` emits `::windows_core::` paths (research note, section 7; test item 15).
windows-core = "=0.62.2"

[dependencies.windows]
# Pinned exactly, as in the app (ADR 0001).
version = "=0.62.2"
features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
