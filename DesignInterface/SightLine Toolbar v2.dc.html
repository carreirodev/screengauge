    <button title="Reabrir" onClick="{{ l.reopen }}" style="width:52px;height:52px;border:none;border-radius:15px;cursor:pointer;display:grid;place-items:center;background:linear-gradient(180deg,oklch(0.85 0.1 220),oklch(0.62 0.16 235) 55%,oklch(0.45 0.15 245));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 20px oklch(0.62 0.16 235 / .4),0 6px 12px rgba(40,50,80,.3)" style-active="transform:scale(.94)"><span style="width:14px;height:14px;border-radius:50%;background:#ffffff;box-shadow:inset 0 -1px 2px rgba(0,0,0,.2)"></span></button>
  </sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TOOLS = ['fit', 'move', 'width', 'height', 'shot', 'zoom'];
const INK = { dark: ['#c3c7cf', '#06141a'], light: ['#4b4843', '#ffffff'] };
class Component extends DCLogic {
  state = { dark: { tool: 'move', collapsed: false, closed: false }, light: { tool: 'move', collapsed: false, closed: false } };
  mk(key) {
    const s = this.state[key];
    const set = p => this.setState(st => ({ [key]: { ...st[key], ...p } }));
    const o = {};
    TOOLS.forEach(t => { const on = s.tool === t; o[t] = { on, c: INK[key][on ? 1 : 0], pick: () => set({ tool: t }) }; });
    return Object.assign(o, {
      expanded: !s.collapsed, open: !s.closed, closed: s.closed,
      chev: s.collapsed ? 'rotate(180deg)' : 'rotate(-90deg)',
      toggle: () => set({ collapsed: !s.collapsed }),
      close: () => set({ closed: true }),
      reopen: () => set({ closed: false })
    });
  }
  renderVals() { return { d: this.mk('dark'), l: this.mk('light') }; }
}
</script>
</body>
